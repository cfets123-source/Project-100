name: Verify Project 100

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Run the full simulated-runtime test suite
        run: PYTHONPATH=backend python -m pytest -q backend/tests
