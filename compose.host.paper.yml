# Single-server, paper-mode deployment. Copy .env.host.example to a host-only
# .env.host file and supply the dashboard credentials there. This file does not
# expose the dashboard to the public internet; use an authenticated tunnel until
# a domain, TLS reverse proxy, and firewall policy have been configured.
services:
  worker:
    build: .
    command: ["python", "-m", "app.runtime.worker", "--database", "/data/paper.db", "run", "--feed", "/feeds/paper-replay.jsonl", "--enable-paper"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
    volumes:
      - paper-data:/data
      - ./backend/examples:/feeds:ro
    restart: "on-failure:3"
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
    volumes:
      - paper-data:/data
    ports: ["127.0.0.1:8000:8000"]
    restart: "on-failure:3"
    depends_on: [worker]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

volumes:
  paper-data:
