# Single-server, paper-mode deployment. Copy .env.host.example to a host-only
# .env.host file and supply the dashboard credentials there. This file does not
# expose the dashboard to the public internet; use an authenticated tunnel until
# a domain, TLS reverse proxy, and firewall policy have been configured.
# Stage Runner v1 (owner-accepted unvalidated experiment). Requires
# `python -m app.services.owner_experiment accept ...` before any cycle trades.
x-stage-runner-risk: &stage_runner_risk
  MAX_RISK_PER_TRADE: "0.25"
  MAX_POSITION_PCT: "0.95"
  MAX_DAILY_LOSS: "0.25"
  MAX_WEEKLY_DRAWDOWN: "0.5"
  MAX_TOTAL_DRAWDOWN: "0.5"
  MAX_SECTOR_CONCENTRATION: "0.95"
  ALPACA_BRACKET_TIME_IN_FORCE: gtc
  WHOLE_SHARES_ONLY: "true"

services:
  worker:
    build: .
    command: ["python", "-m", "app.runtime.worker", "--database", "/data/paper.db", "run", "--feed", "/feeds/paper-replay.jsonl", "--enable-paper"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: simulator:paper
      LIVE_TRADING_ENABLED: "false"
    volumes:
      - paper-data:/data
      - ./backend/examples:/feeds:ro
    restart: "on-failure:3"
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-execution:
    build: .
    # One cycle every three minutes avoids exhausting the broker budget while
    # a protected position is waiting for a target-exit retry.
    command: ["python", "-m", "app.runtime.alpaca_paper_execution_worker", "--database", "sqlite:////data/paper.db", "--account-id", "alpaca-paper", "--symbols", "SPY,QQQ,IWM,GLD,TLT", "--interval", "180"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
    volumes: ["paper-data:/data"]
    restart: "on-failure:3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-broad-paper:
    build: .
    profiles: ["broad-paper"]
    command: ["python", "-m", "app.runtime.alpaca_broad_paper_worker", "--database", "sqlite:////data/paper.db", "--interval", "180"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
      ALPACA_PAPER_EXECUTION_ENABLED: "${ALPACA_BROAD_PAPER_EXECUTION_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    restart: "on-failure:3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-expanded-paper:
    build: .
    profiles: ["expanded-paper"]
    command: ["python", "-m", "app.runtime.alpaca_expanded_paper_worker", "--database", "sqlite:////data/paper.db", "--interval", "180"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
      ALPACA_PAPER_EXECUTION_ENABLED: "${ALPACA_EXPANDED_PAPER_EXECUTION_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    restart: "on-failure:3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-monitor:
    build: .
    # The execution worker already runs this monitor/reconciliation cycle.
    # Keep this separate process opt-in for diagnostics so it cannot double
    # Alpaca API traffic during autonomous paper execution.
    profiles: ["diagnostic-monitor"]
    command: ["python", "-m", "app.runtime.alpaca_monitor_worker", "--database", "sqlite:////data/paper.db", "--symbols", "${ALPACA_MONITOR_SYMBOLS:-AAPL,MSFT}", "--interval", "${ALPACA_MONITOR_INTERVAL_SECONDS:-15}"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
      ALPACA_PAPER_EXECUTION_ENABLED: "false"
    volumes:
      - paper-data:/data
    restart: "on-failure:3"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-live:
    build: .
    command: ["python", "-m", "app.runtime.alpaca_live_worker", "--database", "sqlite:////data/paper.db", "--interval", "60"]
    profiles: ["live"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: live
      STATE_SCOPE: alpaca:live
      LIVE_POSITION_MANAGEMENT_ENABLED: "${LIVE_POSITION_MANAGEMENT_ENABLED:-false}"
      AUTONOMY_LEVEL: "4"
      AUTO_EXECUTION: "true"
      # Activation is supplied only by the host-only environment file after
      # the final preflight passes.  The default remains disabled.
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-broad-live:
    build: .
    profiles: ["broad-live"]
    # Activation must use `docker compose --env-file .env.host ...` so this
    # separate final flag is interpolated from the host-only file.
    command: ["python", "-m", "app.runtime.alpaca_broad_live_worker", "--database", "sqlite:////data/paper.db", "--interval", "60"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: live
      STATE_SCOPE: alpaca:live
      LIVE_POSITION_MANAGEMENT_ENABLED: "${LIVE_POSITION_MANAGEMENT_ENABLED:-false}"
      AUTONOMY_LEVEL: "4"
      AUTO_EXECUTION: "true"
      LIVE_TRADING_ENABLED: "${BROAD_LIVE_TRADING_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-expanded-live:
    build: .
    profiles: ["expanded-live"]
    command: ["python", "-m", "app.runtime.alpaca_expanded_live_worker", "--database", "sqlite:////data/paper.db", "--interval", "60"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: live
      STATE_SCOPE: alpaca:live
      LIVE_POSITION_MANAGEMENT_ENABLED: "${LIVE_POSITION_MANAGEMENT_ENABLED:-false}"
      AUTONOMY_LEVEL: "4"
      AUTO_EXECUTION: "true"
      LIVE_TRADING_ENABLED: "${EXPANDED_LIVE_TRADING_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  alpaca-live-reconciliation:
    build: .
    command: ["python", "-m", "app.runtime.alpaca_live_reconciliation_worker", "--database", "sqlite:////data/paper.db", "--interval", "300"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:live
      LIVE_TRADING_ENABLED: "false"
    volumes: ["paper-data:/data"]
    restart: "on-failure:3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  robinhood-lifecycle:
    build: .
    profiles: ["robinhood"]
    command: ["python", "-m", "app.runtime.robinhood_lifecycle_worker", "--database", "sqlite:////data/paper.db", "--interval", "30"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: live
      STATE_SCOPE: robinhood:live
      LIVE_POSITION_MANAGEMENT_ENABLED: "${LIVE_POSITION_MANAGEMENT_ENABLED:-false}"
      AUTONOMY_LEVEL: "4"
      AUTO_EXECUTION: "true"
      LIVE_TRADING_ENABLED: "${ROBINHOOD_LIVE_TRADING_ENABLED:-false}"
      ROBINHOOD_EQUITY_EXECUTION_ENABLED: "${ROBINHOOD_EQUITY_EXECUTION_ENABLED:-false}"
      ROBINHOOD_CRYPTO_EXECUTION_ENABLED: "${ROBINHOOD_CRYPTO_EXECUTION_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  robinhood-option-quotes:
    build: .
    profiles: ["option-research"]
    command: ["python", "-m", "app.runtime.robinhood_option_quote_worker", "--database", "sqlite:////data/paper.db", "--interval", "120"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
      ROBINHOOD_OPTION_RESEARCH_IDS: "${ROBINHOOD_OPTION_RESEARCH_IDS:-}"
    volumes: ["paper-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  robinhood-option-watchlist:
    build: .
    profiles: ["option-research"]
    command: ["python", "-m", "app.runtime.robinhood_option_watchlist", "--database", "sqlite:////data/paper.db", "--interval", "120"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
      ROBINHOOD_OPTION_WATCHLIST_UNDERLYINGS: "${ROBINHOOD_OPTION_WATCHLIST_UNDERLYINGS:-SPY,QQQ,IWM,NVDA,TSLA,AAPL}"
      ROBINHOOD_OPTION_WATCHLIST_MAX_PREMIUM_USD: "${ROBINHOOD_OPTION_WATCHLIST_MAX_PREMIUM_USD:-100}"
    volumes: ["paper-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  stage-runner-paper:
    build: .
    profiles: ["stage-paper"]
    command: ["python", "-m", "app.runtime.stage_runner_worker", "--mode", "paper", "--database", "sqlite:////data/paper.db", "--account-id", "alpaca-paper", "--interval", "120"]
    env_file: .env.host
    environment:
      <<: *stage_runner_risk
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      STARTING_CAPITAL: "100"
      ALPACA_PAPER_EXECUTION_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
    volumes: ["paper-data:/data"]
    restart: "on-failure:3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  stage-runner-live:
    build: .
    profiles: ["stage-live"]
    command: ["python", "-m", "app.runtime.stage_runner_worker", "--mode", "live", "--database", "sqlite:////data/paper.db", "--interval", "60"]
    env_file: .env.host
    environment:
      <<: *stage_runner_risk
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: live
      STATE_SCOPE: alpaca:live
      LIVE_POSITION_MANAGEMENT_ENABLED: "${LIVE_POSITION_MANAGEMENT_ENABLED:-false}"
      AUTONOMY_LEVEL: "4"
      AUTO_EXECUTION: "true"
      # Final switch comes only from the host-only env file.
      LIVE_TRADING_ENABLED: "${STAGE_RUNNER_LIVE_TRADING_ENABLED:-false}"
    volumes: ["paper-data:/data"]
    restart: "on-failure:3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.host
    environment:
      DATABASE_URL: sqlite:////data/paper.db
      TRADING_MODE: paper
      STATE_SCOPE: alpaca:paper
      LIVE_TRADING_ENABLED: "false"
    volumes:
      - paper-data:/data
    ports: ["127.0.0.1:8000:8000"]
    restart: "on-failure:3"
    depends_on: [worker]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

volumes:
  paper-data:
